components:
  schemas:
    AppInfo:
      description: Metadata about an app.
      properties:
        description:
          default: ''
          title: Description
          type: string
        extra:
          additionalProperties: true
          title: Extra
          type: object
        name:
          title: Name
          type: string
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
      required:
      - name
      - source_kind
      title: AppInfo
      type: object
    AppState:
      description: Status of a running app.
      enum:
      - starting
      - running
      - done
      - stopping
      - error
      title: AppState
      type: string
    AppStatus:
      description: Status of an app.
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        info:
          $ref: '#/components/schemas/AppInfo'
        state:
          $ref: '#/components/schemas/AppState'
      required:
      - info
      - state
      title: AppStatus
      type: object
    AppUpdateStatus:
      description: Status of an app update check.
      properties:
        app_name:
          title: App Name
          type: string
        installed_sha:
          title: Installed Sha
          type: string
        last_modified:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Modified
        latest_sha:
          title: Latest Sha
          type: string
        space_id:
          title: Space Id
          type: string
        update_available:
          title: Update Available
          type: boolean
      required:
      - app_name
      - space_id
      - installed_sha
      - latest_sha
      - update_available
      title: AppUpdateStatus
      type: object
    AppUpdatesResponse:
      description: Response for list of app updates.
      properties:
        apps_checked:
          title: Apps Checked
          type: integer
        apps_skipped:
          title: Apps Skipped
          type: integer
        apps_with_updates:
          items:
            $ref: '#/components/schemas/AppUpdateStatus'
          title: Apps With Updates
          type: array
      required:
      - apps_with_updates
      - apps_checked
      - apps_skipped
      title: AppUpdatesResponse
      type: object
    ApplyAudioConfigRequest:
      description: Request body for ``POST /audio/config/apply``.
      properties:
        config:
          items:
            $ref: '#/components/schemas/AudioParamPair'
          title: Config
          type: array
        verify:
          default: true
          title: Verify
          type: boolean
      required:
      - config
      title: ApplyAudioConfigRequest
      type: object
    ApplyAudioConfigResponse:
      description: Response body for ``POST /audio/config/apply``.
      properties:
        applied:
          title: Applied
          type: boolean
      required:
      - applied
      title: ApplyAudioConfigResponse
      type: object
    AudioParamPair:
      description: One ``(parameter_name, values)`` pair in an audio config payload.
      properties:
        name:
          title: Name
          type: string
        values:
          items:
            type: number
          title: Values
          type: array
      required:
      - name
      - values
      title: AudioParamPair
      type: object
    Body_upload_sound_api_media_sounds_upload_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
      required:
      - file
      title: Body_upload_sound_api_media_sounds_upload_post
      type: object
    CameraSpecsResponse:
      description: Full camera specifications as detected by the daemon.
      properties:
        D:
          items:
            type: number
          title: D
          type: array
        K:
          items:
            items:
              type: number
            type: array
          title: K
          type: array
        available_resolutions:
          items:
            $ref: '#/components/schemas/ResolutionInfo'
          title: Available Resolutions
          type: array
        default_resolution:
          $ref: '#/components/schemas/ResolutionInfo'
        name:
          title: Name
          type: string
      required:
      - name
      - available_resolutions
      - default_resolution
      - K
      - D
      title: CameraSpecsResponse
      type: object
    DaemonState:
      description: Enum representing the state of the Reachy Mini daemon.
      enum:
      - not_initialized
      - starting
      - running
      - stopping
      - stopped
      - error
      title: DaemonState
      type: string
    DaemonStatus:
      description: Status of the Reachy Mini daemon.
      properties:
        backend_status:
          anyOf:
          - $ref: '#/components/schemas/RobotBackendStatus'
          - $ref: '#/components/schemas/MujocoBackendStatus'
          - $ref: '#/components/schemas/MockupSimBackendStatus'
          - type: 'null'
          title: Backend Status
        camera_specs_name:
          default: ''
          title: Camera Specs Name
          type: string
        desktop_app_daemon:
          title: Desktop App Daemon
          type: boolean
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        face_target:
          $ref: '#/components/schemas/FaceTarget'
        hardware_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Hardware Id
        media_released:
          default: false
          title: Media Released
          type: boolean
        mockup_sim_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Mockup Sim Enabled
        no_media:
          default: false
          title: No Media
          type: boolean
        robot_name:
          title: Robot Name
          type: string
        simulation_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Simulation Enabled
        state:
          $ref: '#/components/schemas/DaemonState'
        type:
          const: daemon_status
          default: daemon_status
          title: Type
          type: string
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        wireless_version:
          title: Wireless Version
          type: boolean
        wlan_ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Wlan Ip
      required:
      - robot_name
      - state
      - wireless_version
      - desktop_app_daemon
      - simulation_enabled
      - mockup_sim_enabled
      - backend_status
      title: DaemonStatus
      type: object
    DoaSnapshot:
      description: 'Sound Direction of Arrival reading (ReSpeaker mic array).


        ``angle`` is in radians: 0 = left, π/2 = front, π = right.'
      properties:
        angle:
          title: Angle
          type: number
        speech_detected:
          title: Speech Detected
          type: boolean
      required:
      - angle
      - speech_detected
      title: DoaSnapshot
      type: object
    EnableTrackingRequest:
      description: Request body for enabling daemon-side head tracking.
      properties:
        weight:
          default: 1.0
          maximum: 1.0
          minimum: 0.0
          title: Weight
          type: number
      title: EnableTrackingRequest
      type: object
    FaceTarget:
      description: Latest daemon-side face target used for head tracking.
      properties:
        detected:
          default: false
          title: Detected
          type: boolean
        roll:
          anyOf:
          - type: number
          - type: 'null'
          title: Roll
        ts:
          anyOf:
          - type: number
          - type: 'null'
          title: Ts
        x:
          anyOf:
          - type: number
          - type: 'null'
          title: X
        y:
          anyOf:
          - type: number
          - type: 'null'
          title: Y
      title: FaceTarget
      type: object
    FullBodyTarget:
      description: Represent the full body including the head pose and the joints for antennas.
      examples:
      - target_antennas:
        - 0.0
        - 0.0
        target_body_yaw: 0.0
        target_head_pose:
          pitch: 0.0
          roll: 0.0
          x: 0.0
          y: 0.0
          yaw: 0.0
          z: 0.0
      properties:
        target_antennas:
          anyOf:
          - maxItems: 2
            minItems: 2
            prefixItems:
            - type: number
            - type: number
            type: array
          - type: 'null'
          title: Target Antennas
        target_body_yaw:
          anyOf:
          - type: number
          - type: 'null'
          title: Target Body Yaw
        target_head_pose:
          anyOf:
          - $ref: '#/components/schemas/XYZRPYPose'
          - $ref: '#/components/schemas/Matrix4x4Pose'
          - type: 'null'
          title: Target Head Pose
        timestamp:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Timestamp
      title: FullBodyTarget
      type: object
    FullState:
      description: Represent the full state of the robot including all joint positions and poses.
      properties:
        antennas_position:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Antennas Position
        body_yaw:
          anyOf:
          - type: number
          - type: 'null'
          title: Body Yaw
        control_mode:
          anyOf:
          - $ref: '#/components/schemas/MotorControlMode'
          - type: 'null'
        doa:
          anyOf:
          - $ref: '#/components/schemas/DoaSnapshot'
          - type: 'null'
        head_joints:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Head Joints
        head_pose:
          anyOf:
          - $ref: '#/components/schemas/XYZRPYPose'
          - $ref: '#/components/schemas/Matrix4x4Pose'
          - type: 'null'
          title: Head Pose
        passive_joints:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Passive Joints
        timestamp:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Timestamp
      title: FullState
      type: object
    GotoModelRequest:
      description: Request model for the goto endpoint.
      examples:
      - antennas:
        - 0.0
        - 0.0
        body_yaw: 0.0
        duration: 2.0
        head_pose:
          pitch: 0.0
          roll: 0.0
          x: 0.0
          y: 0.0
          yaw: 0.0
          z: 0.0
        interpolation: minjerk
      - antennas:
        - 0.0
        - 0.0
        duration: 1.0
        interpolation: linear
      properties:
        antennas:
          anyOf:
          - maxItems: 2
            minItems: 2
            prefixItems:
            - type: number
            - type: number
            type: array
          - type: 'null'
          title: Antennas
        body_yaw:
          anyOf:
          - type: number
          - type: 'null'
          title: Body Yaw
        duration:
          title: Duration
          type: number
        head_pose:
          anyOf:
          - $ref: '#/components/schemas/XYZRPYPose'
          - $ref: '#/components/schemas/Matrix4x4Pose'
          - type: 'null'
          title: Head Pose
        interpolation:
          $ref: '#/components/schemas/InterpolationTechnique'
          default: minjerk
      required:
      - duration
      title: GotoModelRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InterpolationTechnique:
      description: Enumeration of interpolation techniques.
      enum:
      - linear
      - minjerk
      - ease_in_out
      - cartoon
      title: InterpolationTechnique
      type: string
    JobInfo:
      description: Pydantic model for install job status.
      properties:
        command:
          title: Command
          type: string
        logs:
          items:
            type: string
          title: Logs
          type: array
        status:
          $ref: '#/components/schemas/JobStatus'
      required:
      - command
      - status
      - logs
      title: JobInfo
      type: object
    JobStatus:
      description: Enum for job status.
      enum:
      - pending
      - in_progress
      - done
      - failed
      title: JobStatus
      type: string
    Matrix4x4Pose:
      description: Represent a 3D pose by its 4x4 transformation matrix (translation is expressed in meters).
      properties:
        m:
          maxItems: 16
          minItems: 16
          prefixItems:
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          - type: number
          title: M
          type: array
      required:
      - m
      title: Matrix4x4Pose
      type: object
    MockupSimBackendStatus:
      description: Status of the MockupSim backend.
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        motor_control_mode:
          $ref: '#/components/schemas/MotorControlMode'
      required:
      - motor_control_mode
      title: MockupSimBackendStatus
      type: object
    MotorControlMode:
      description: Enum for motor control modes.
      enum:
      - enabled
      - disabled
      - gravity_compensation
      title: MotorControlMode
      type: string
    MotorStatus:
      description: 'Represents the status of the motors.


        Exposes

        - mode: The current motor control mode (enabled, disabled, gravity_compensation).'
      properties:
        mode:
          $ref: '#/components/schemas/MotorControlMode'
      required:
      - mode
      title: MotorStatus
      type: object
    MoveUUID:
      description: Model representing a unique identifier for a move task.
      properties:
        uuid:
          format: uuid
          title: Uuid
          type: string
      required:
      - uuid
      title: MoveUUID
      type: object
    MujocoBackendStatus:
      description: Status of the Mujoco backend.
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        motor_control_mode:
          $ref: '#/components/schemas/MotorControlMode'
      required:
      - motor_control_mode
      title: MujocoBackendStatus
      type: object
    PlaySoundRequest:
      description: Request body for the play_sound endpoint.
      properties:
        file:
          title: File
          type: string
      required:
      - file
      title: PlaySoundRequest
      type: object
    PrivateSpaceInstallRequest:
      description: Request model for installing a private HuggingFace space.
      properties:
        space_id:
          title: Space Id
          type: string
      required:
      - space_id
      title: PrivateSpaceInstallRequest
      type: object
    ReadAudioParameterResponse:
      description: Response body for ``GET /audio/config/parameter/{name}``.
      properties:
        name:
          title: Name
          type: string
        values:
          items:
            anyOf:
            - type: number
            - type: integer
          title: Values
          type: array
      required:
      - name
      - values
      title: ReadAudioParameterResponse
      type: object
    ResolutionInfo:
      description: A single camera resolution entry.
      properties:
        crop_factor:
          title: Crop Factor
          type: number
        fps:
          title: Fps
          type: integer
        height:
          title: Height
          type: integer
        name:
          title: Name
          type: string
        width:
          title: Width
          type: integer
      required:
      - name
      - width
      - height
      - fps
      - crop_factor
      title: ResolutionInfo
      type: object
    RobotAppLockState:
      description: Lock state enum. Values are stable strings suitable for serialization.
      enum:
      - free
      - local_app
      - remote_session
      title: RobotAppLockState
      type: string
    RobotAppLockStatus:
      description: 'Snapshot of the lock state, suitable for JSON serialization.


        Returned by :meth:`RobotAppLock.status` and by the

        ``GET /api/daemon/robot-app-lock-status`` endpoint.'
      properties:
        holder_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Holder Name
        state:
          $ref: '#/components/schemas/RobotAppLockState'
      required:
      - state
      title: RobotAppLockStatus
      type: object
    RobotBackendStatus:
      description: Status of the Robot Backend.
      properties:
        control_loop_stats:
          additionalProperties: true
          title: Control Loop Stats
          type: object
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        last_alive:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Alive
        motor_control_mode:
          $ref: '#/components/schemas/MotorControlMode'
        ready:
          title: Ready
          type: boolean
      required:
      - ready
      - motor_control_mode
      - last_alive
      - control_loop_stats
      title: RobotBackendStatus
      type: object
    RobotNameRequest:
      description: Body for setting the robot display name.
      properties:
        name:
          maxLength: 64
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: RobotNameRequest
      type: object
    RobotNameResponse:
      description: The robot's current display name (``null`` only if none is resolvable).
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      title: RobotNameResponse
      type: object
    SealedConnect:
      description: Sealed WiFi-connect payload (base64 fields, see scheme above).
      properties:
        ct:
          title: Ct
          type: string
        epk:
          title: Epk
          type: string
        kid:
          title: Kid
          type: string
        nonce:
          title: Nonce
          type: string
        ssid:
          title: Ssid
          type: string
      required:
      - ssid
      - kid
      - epk
      - nonce
      - ct
      title: SealedConnect
      type: object
    SourceKind:
      description: Kinds of app source.
      enum:
      - hf_space
      - dashboard_selection
      - local
      - installed
      title: SourceKind
      type: string
    StartupApp:
      description: The app configured to auto-start on the robot's first wake-up.
      properties:
        startup_app:
          anyOf:
          - type: string
          - type: 'null'
          title: Startup App
      title: StartupApp
      type: object
    TestSoundResponse:
      description: Response model for test sound operations.
      properties:
        message:
          title: Message
          type: string
        status:
          title: Status
          type: string
      required:
      - status
      - message
      title: TestSoundResponse
      type: object
    TokenRequest:
      description: Request model for saving a HuggingFace token.
      properties:
        token:
          title: Token
          type: string
      required:
      - token
      title: TokenRequest
      type: object
    TokenResponse:
      description: Response model for token operations.
      properties:
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        status:
          title: Status
          type: string
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
      required:
      - status
      title: TokenResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VolumeRequest:
      description: Request model for setting volume.
      properties:
        volume:
          description: Volume level (0-100)
          maximum: 100.0
          minimum: 0.0
          title: Volume
          type: integer
      required:
      - volume
      title: VolumeRequest
      type: object
    VolumeResponse:
      description: Response model for volume operations.
      properties:
        device:
          title: Device
          type: string
        platform:
          title: Platform
          type: string
        volume:
          title: Volume
          type: integer
      required:
      - volume
      - platform
      - device
      title: VolumeResponse
      type: object
    WifiMode:
      description: WiFi possible modes.
      enum:
      - hotspot
      - wlan
      - disconnected
      - busy
      title: WifiMode
      type: string
    WifiStatus:
      description: WiFi status model.
      properties:
        connected_network:
          anyOf:
          - type: string
          - type: 'null'
          title: Connected Network
        known_networks:
          items:
            type: string
          title: Known Networks
          type: array
        mode:
          $ref: '#/components/schemas/WifiMode'
      required:
      - mode
      - known_networks
      - connected_network
      title: WifiStatus
      type: object
    XYZRPYPose:
      description: Represent a 3D pose using position (x, y, z) in meters and orientation (roll, pitch,
        yaw) angles in radians.
      properties:
        pitch:
          default: 0.0
          title: Pitch
          type: number
        roll:
          default: 0.0
          title: Roll
          type: number
        x:
          default: 0.0
          title: X
          type: number
        y:
          default: 0.0
          title: Y
          type: number
        yaw:
          default: 0.0
          title: Yaw
          type: number
        z:
          default: 0.0
          title: Z
          type: number
      title: XYZRPYPose
      type: object
info:
  description: 'Reachy Mini 本体の daemon が公開する REST API。

    取得元: http://reachy-mini.local:8000/openapi.json

    取得日: 2026-08-30 / 本体daemon 1.10.0

    ブラウザから http://reachy-mini.local:8000/docs (Swagger UI) と /redoc で閲覧できる。

    公式ドキュメントサイトには記載がないため、このファイルは実機から取得した記録。

    info の title と version は元データでは FastAPI の初期値だったため、ここで補った。'
  title: Reachy Mini daemon REST API
  version: 0.1.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Redirect to the desktop app download page.
      operationId: dashboard__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Dashboard
  /api/apps/check-updates:
    get:
      description: 'Check all installed apps for available updates.


        Results are cached for 5 minutes unless force=True.

        This performs a ''slow'' check with rate limiting to avoid overwhelming HuggingFace.'
      operationId: check_app_updates_api_apps_check_updates_get
      parameters:
      - in: query
        name: force
        required: false
        schema:
          default: false
          title: Force
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUpdatesResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Check App Updates
  /api/apps/current-app-status:
    get:
      description: Get the status of the currently running app, if any.
      operationId: current_app_status_api_apps_current_app_status_get
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AppStatus'
                - type: 'null'
                title: Response Current App Status Api Apps Current App Status Get
          description: Successful Response
      summary: Current App Status
  /api/apps/install:
    post:
      description: Install a new app by its info (background, returns job_id).
      operationId: install_app_api_apps_install_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppInfo'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Install App Api Apps Install Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Install App
  /api/apps/install-private-space:
    post:
      description: 'Install a private HuggingFace space.


        Requires HF token to be stored via /api/hf-auth/save-token first.'
      operationId: install_private_space_api_apps_install_private_space_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateSpaceInstallRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
